<!DOCTYPE html>
<html>
<head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1e1e1e;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    h2 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #fff;
    }

    .drop-zone {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 360px;
      border: 2px dashed #555;
      border-radius: 12px;
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #2a2a2a;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: #a259ff;
      background: #332244;
    }

    .drop-zone p {
      font-size: 14px;
      color: #aaa;
      margin-top: 8px;
    }

    .drop-zone .icon {
      font-size: 36px;
      margin-bottom: 8px;
    }

    input[type="file"] {
      position: absolute;
      width: 0;
      height: 0;
      opacity: 0;
      pointer-events: none;
    }

    .status {
      margin-top: 16px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
      min-height: 20px;
    }

    .status.error {
      color: #ff6b6b;
    }

    .status.success {
      color: #51cf66;
    }

    .progress-bar {
      width: 100%;
      max-width: 360px;
      height: 4px;
      background: #333;
      border-radius: 2px;
      margin-top: 12px;
      overflow: hidden;
      display: none;
    }

    .progress-bar.active {
      display: block;
    }

    .progress-bar .fill {
      height: 100%;
      background: #a259ff;
      border-radius: 2px;
      transition: width 0.3s;
      width: 0%;
    }

    .options {
      margin-top: 16px;
      width: 100%;
      max-width: 360px;
    }

    .option-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 13px;
    }

    .option-row label {
      color: #ccc;
    }

    .toggle {
      position: relative;
      width: 36px;
      height: 20px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #555;
      border-radius: 20px;
      transition: 0.2s;
    }

    .toggle .slider:before {
      content: "";
      position: absolute;
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.2s;
    }

    .toggle input:checked + .slider {
      background-color: #a259ff;
    }

    .toggle input:checked + .slider:before {
      transform: translateX(16px);
    }

    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: #666;
    }
  </style>
</head>
<body>
  <h2>PSD Importer</h2>

  <label class="drop-zone" id="dropZone" for="fileInput">
    <div class="icon">&#128193;</div>
    <strong>Arraste um arquivo .psd aqui</strong>
    <p>ou clique para selecionar</p>
    <input type="file" id="fileInput" accept=".psd,.psb" />
  </label>

  <div class="options">
    <div class="option-row">
      <label>Importar textos como editaveis</label>
      <label class="toggle">
        <input type="checkbox" id="optText" checked />
        <span class="slider"></span>
      </label>
    </div>
    <div class="option-row">
      <label>Preservar opacidade das camadas</label>
      <label class="toggle">
        <input type="checkbox" id="optOpacity" checked />
        <span class="slider"></span>
      </label>
    </div>
    <div class="option-row">
      <label>Importar camadas ocultas</label>
      <label class="toggle">
        <input type="checkbox" id="optHidden" />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="progress-bar" id="progressBar">
    <div class="fill" id="progressFill"></div>
  </div>

  <div class="status" id="status"></div>

  <div class="footer">Open Source — ag-psd + Figma Plugin API</div>

  <script type="module">
    import { readPsd, initializeCanvas } from 'https://cdn.jsdelivr.net/npm/ag-psd@22.2.1/dist/browser.mjs';

    // Initialize ag-psd with browser Canvas support
    initializeCanvas(
      (width, height) => {
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        return canvas;
      },
      (src) => {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error('Failed to load image'));
          img.src = src;
        });
      }
    );

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) processFile(file);
    });

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (file) processFile(file);
    });

    function setStatus(msg, type) {
      status.textContent = msg;
      status.className = 'status' + (type ? ' ' + type : '');
    }

    function setProgress(percent) {
      progressFill.style.width = percent + '%';
    }

    // Extract PNG bytes from a canvas
    async function canvasToPng(canvas) {
      if (!canvas) return null;
      try {
        const blob = await new Promise((resolve) => {
          canvas.toBlob(resolve, 'image/png');
        });
        if (!blob) return null;
        const buffer = await blob.arrayBuffer();
        return new Uint8Array(buffer);
      } catch (e) {
        return null;
      }
    }

    // Recursively serialize PSD layers into a plain object with image bytes
    async function serializeLayer(layer, onProgress) {
      const result = {
        name: layer.name || 'Layer',
        left: layer.left,
        top: layer.top,
        right: layer.right,
        bottom: layer.bottom,
        opacity: layer.opacity,
        hidden: layer.hidden || false,
        blendMode: layer.blendMode,
        imageBytes: null,
        imageWidth: 0,
        imageHeight: 0,
        text: null,
        hasVectorMask: !!(layer.vectorMask),
        hasMask: !!(layer.mask),
        children: null,
      };

      // Extract image from canvas
      if (layer.canvas) {
        const png = await canvasToPng(layer.canvas);
        if (png) {
          result.imageBytes = png;
          result.imageWidth = layer.canvas.width;
          result.imageHeight = layer.canvas.height;
        }
      }

      // Extract text info
      if (layer.text) {
        result.text = {
          value: layer.text.text || '',
          fontName: null,
          fontSize: null,
          fillColor: null,
          fauxBold: false,
          fauxItalic: false,
        };
        if (layer.text.style) {
          const s = layer.text.style;
          if (s.font && s.font.name) {
            result.text.fontName = s.font.name;
          }
          if (s.fontSize) {
            result.text.fontSize = s.fontSize;
          }
          if (s.fillColor) {
            result.text.fillColor = {
              r: s.fillColor.r || 0,
              g: s.fillColor.g || 0,
              b: s.fillColor.b || 0,
              a: s.fillColor.a !== undefined ? s.fillColor.a : 1,
            };
          }
          result.text.fauxBold = !!s.fauxBold;
          result.text.fauxItalic = !!s.fauxItalic;
        }
      }

      // Process children recursively
      if (layer.children && layer.children.length > 0) {
        result.children = [];
        for (const child of layer.children) {
          const serialized = await serializeLayer(child, onProgress);
          result.children.push(serialized);
          if (onProgress) onProgress();
        }
      }

      return result;
    }

    function countLayers(layers) {
      let count = 0;
      for (const l of layers) {
        count++;
        if (l.children) count += countLayers(l.children);
      }
      return count;
    }

    async function processFile(file) {
      if (!file.name.match(/\.(psd|psb)$/i)) {
        setStatus('Por favor, selecione um arquivo .psd ou .psb', 'error');
        return;
      }

      setStatus('Lendo arquivo...', '');
      progressBar.classList.add('active');
      setProgress(10);

      try {
        const arrayBuffer = await file.arrayBuffer();
        setProgress(25);
        setStatus('Parsing PSD (decodificando camadas)...', '');

        // Parse PSD in the UI thread (has Canvas access)
        const psd = readPsd(new Uint8Array(arrayBuffer), {
          skipCompositeImageData: false,
          skipLayerImageData: false,
          skipThumbnail: true,
        });

        if (!psd) {
          setStatus('Falha ao interpretar o arquivo PSD.', 'error');
          progressBar.classList.remove('active');
          return;
        }

        setProgress(40);
        setStatus('Extraindo imagens das camadas...', '');

        const allLayers = psd.children || [];
        const totalLayers = countLayers(allLayers);
        let processed = 0;

        const onProgress = () => {
          processed++;
          const pct = 40 + Math.round((processed / Math.max(totalLayers, 1)) * 30);
          setProgress(Math.min(pct, 70));
          if (processed % 3 === 0) {
            setStatus('Extraindo camada ' + processed + '/' + totalLayers + '...', '');
          }
        };

        // Serialize all layers (extract PNG bytes from canvases)
        const serializedLayers = [];
        for (const layer of allLayers) {
          const s = await serializeLayer(layer, onProgress);
          serializedLayers.push(s);
        }

        // Get composite image
        let compositeBytes = null;
        if (psd.canvas) {
          compositeBytes = await canvasToPng(psd.canvas);
        }

        setProgress(75);
        setStatus('Enviando para o Figma...', '');

        const options = {
          importText: document.getElementById('optText').checked,
          preserveOpacity: document.getElementById('optOpacity').checked,
          importHidden: document.getElementById('optHidden').checked,
        };

        // Send parsed data to plugin code
        parent.postMessage({
          pluginMessage: {
            type: 'import-psd-parsed',
            psdWidth: psd.width || 1920,
            psdHeight: psd.height || 1080,
            fileName: file.name,
            layers: serializedLayers,
            compositeBytes: compositeBytes,
            options: options,
          }
        }, '*');

      } catch (err) {
        setStatus('Erro ao processar: ' + (err.message || err), 'error');
        progressBar.classList.remove('active');
      }
    }

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'progress') {
        setProgress(msg.percent);
        setStatus(msg.message, '');
      } else if (msg.type === 'done') {
        setProgress(100);
        setStatus(msg.message, 'success');
        setTimeout(() => {
          progressBar.classList.remove('active');
        }, 2000);
      } else if (msg.type === 'error') {
        setStatus(msg.message, 'error');
        progressBar.classList.remove('active');
      }
    };
  </script>
</body>
</html>
